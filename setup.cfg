[metadata]
name = lung-nodule-detection
version = 1.0.0
author = Lung Nodule AI Team
description = Desktop application for lung nodule detection and analysis using deep learning
long_description = file: README.md
long_description_content_type = text/markdown
url = https://github.com/yourusername/lung-nodule-detection
python_requires = >=3.9

[options]
packages = find:
install_requires =
    numpy>=1.23
    scipy>=1.10
    torch>=2.0
    torchvision>=0.15
    torchaudio>=2.0
    pydicom>=2.3
    PyQt6>=6.4
    requests>=2.31
    psutil>=5.9
    Pillow>=8.0.0

[options.packages.find]
where = .

[options.entry_points]
console_scripts =
    lung-nodule-detection = app:main
